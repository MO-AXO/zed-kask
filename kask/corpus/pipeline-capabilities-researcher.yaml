# Capabilities Researcher — Full Pipeline Manifest v9.0
# Traces from raw files through trained LoRA adapter.
#
# Type: PipelineManifest
# Persona: Business and Economics Researcher — Capability-Performance Gap Analysis
# Source: 141 files (83 PDF + 49 HTML + 9 other) in corpus/source-library/
# Target: Bloom-balanced QAs for EVA LoRA training via Axolotl
#
# Architecture (v9.0 — Inter-Phase Gate System):
#   Same tool architecture as v8.0, with explicit type: gate steps between
#   every phase. Gates are BLOCKING — the agent MUST evaluate every check in
#   a gate before proceeding to the next phase. A failed check halts the
#   pipeline and triggers remediation.
#
#   Gate schema and execution contract:
#     - id: gate_<name>
#       type: gate
#       blocking: true
#       pass_policy: all
#       description: >
#         What this gate verifies and which next step it protects.
#       checks:
#         - name: <check_id>
#           artifact: <path or response being reconciled>
#           command: |
#             <self-contained shell/Python check>
#           pass: "command exits 0 after printing GATE_PASS"
#           fail: "any non-zero exit, parse error, missing artifact, or mismatch"
#           remediation: >
#             <specific repair and exact re-check instructions>
#       on_failure:
#         action: halt
#         resume: "remediate, rerun this entire gate, and continue only when every check passes"
#
#   The command exit status is authoritative. Every command must print a compact
#   measurement summary and GATE_PASS only after all assertions hold. Missing
#   tools, unreadable files, malformed JSONL, or indeterminate measurements are
#   failures, never implicit passes. Response checks supplement artifact checks;
#   they never replace disk reconciliation. For batched retries, merge outputs by
#   stable key (source filename, entity_ref, or chunk_ref), reject duplicates, and
#   rerun the gate against the fully assembled artifact.
#
#   Command prerequisites: python3 for JSONL/set reconciliation and sqlcipher for
#   encrypted DB inspection. A missing prerequisite makes the measurement
#   indeterminate and therefore fails closed; install it before the DB-backed gates.
#
#   Gate placement (11 gates, one between each phase):
#     Phase 0: extract_text
#       → GATE: extract_complete
#     Phase 1: chunk_all → purge_existing
#       → GATE: chunk_complete
#     Phase 2a: tag_chunks
#       → GATE: tag_complete
#     Phase 2b: embed_chunks
#       → GATE: embed_complete
#     Phase 2c: extract_triples
#       → GATE: triples_complete
#     Phase 3: dedup_chunks
#       → GATE: dedup_complete
#     Phase 4: consolidate_chunks
#       → GATE: consolidate_complete
#     Phase 5: build_prompts
#       → GATE: prompts_complete
#     Phase 6: generate_qas
#       → GATE: qa_generation_complete
#     Phase 7: ingest_qas
#       → GATE: qa_ingest_complete
#     Phase 8: assemble_chatml
#       → GATE: chatml_complete
#     Phase 9: train_lora (terminal — no gate after)
#
# Architecture (v8.0 — tool layer, unchanged):
#   Corpus steps (corpus_*) run in-process against the unified hkask-mcp-corpus
#   server; training steps (training_*) cross to the hkask-mcp-training server.
#   The former `kask mcp invoke` CLI has been removed — manifests are
#   orchestrated in-process from the agent panel.
#
#   Phase 2 is split into three separate steps (v6.0 combined them into one
#   LLM call which caused bugs — wrong model, bypassed ContentGuard):
#     2a. corpus_tag_chunks — canonical classifier → ontology tags JSONL
#     2b. corpus_embed      — Qwen3-Embedding-0.6B → ontology-anchored DB vectors
#     2c. corpus_extract_triples — canonical classifier → RDF triple h_mems in DB
#
#   Each tool uses its own Jinja2 template from registry/templates/docproc/:
#     tag-chunks.j2, extract-hmems.j2, consolidate-chunks.j2,
#     generate-qa.j2, build-prompts.j2
#
#   h_mem design:
#     entity = chunk_ref (what the memory is about)
#     owner_webid = WebID::from_persona("john-brooks") (whose memory it is)
#     All h_mems queryable via semantic.query_deduped(chunk_ref)
#
# Tool response fields (verified from source — used by verify blocks and gates):
#   corpus_convert (dir):     source_documents, total_documents, extracted, skipped, failed, failures[]
#   corpus_chunk (dir):       total_documents, total_chunks, indexed
#   corpus_purge_qa:          embeddings_before, embeddings_purged, embeddings_after, h_mems_purged, h_mem_errors
#   corpus_tag_chunks:        total_chunks, tagged, failed, dimensions, expertise_levels, time_seconds
#   corpus_embed:             total, embedded, failed, model
#   corpus_extract_triples:   total_chunks, succeeded, failed, h_mems_stored
#   corpus_dedup_chunks:      original, deduped, removed, clusters, sources, reduction_pct
#   corpus_consolidate_chunks: original, consolidated, multi_chunk_clusters, absorbed, reembedded, reduction_pct
#   corpus_build_prompts:     total_chunks, prompts_written, output
#   corpus_generate_qa_batch: total, written, failed, output
#   corpus_ingest_qa:         parsed, filtered, deduped, stored_h_mems, output
#   training_assemble_dataset: train_examples, train_path, total_matched, (optional) test_examples, test_path
#   training_submit:          job_id, provider_job_id, status, base_model, host, estimated_cost_urj
#
# Models (approved, in .env):
#   Classifier/Tagging/Triples: OR/deepseek/deepseek-v4-flash (HKASK_CLASSIFIER_MODEL)
#   QA generation:              OpenRouter/z-ai/glm-5.2 (HKASK_DEFAULT_MODEL — hkask default)
#   Embedding:                  DI/Qwen/Qwen3-Embedding-0.6B (HKASK_EMBEDDING_MODEL)
#
# Changelog:
#   v9.0 (2026-08-10) — Inter-phase gate system:
#     - Added 11 type: gate steps between every phase (see gate placement above).
#     - Each gate reconciles durable disk/DB artifacts and then cross-checks
#       tool response fields; response counts alone can never pass a gate.
#     - Gates are BLOCKING: the agent MUST NOT proceed if any check fails.
#     - Each check includes specific remediation instructions for its failure mode.
#     - Gate 1 (extract_complete) would have caught the v8.0 bug where the agent
#       proceeded to chunking with only 85/141 files extracted (min: 80 threshold
#       was both too low and checked tool response count, not disk artifacts).
#     - Replaced arbitrary minimum-count verifies with exact source/failure
#       assertions where static truth exists; dynamic counts are reconciled by gates.
#     - Updated source count from 106 to 141 (83 PDF + 49 HTML + 9 other).
#     - Documented all tool response fields in header for gate/verify reference.
#
#   v8.0 → v7.0 lessons learned (preserved):
#     - Combined classify-chunks.j2 template caused bugs: wrong model, bypassed
#       ContentGuard, stored h_mems with wrong entity (triple.subject vs chunk_ref).
#       Split into separate tag_chunks + extract_triples tools with separate templates.
#     - Qwen3.6 and GLM-5.2 have thinking mode — extract_json_from_response finds
#       { ... } in reasoning + JSON response. All MCP tools now handle this.
#     - Template name mismatch: code called "extract-h_mems" but file is "extract-hmems.j2"
#       — fixed in v7.0.
#     - h_mem owner was hardcoded "corpus" instead of "john-brooks" — fixed with
#       owner parameter on all tools, defaulting to "john-brooks".
#     - build-prompts never queried h_mems as knowledge graph — v7.0 adds
#       semantic.query_deduped(chunk_ref) per chunk, injects as "## Knowledge Graph"
#       section in system prompt via build-prompts.j2 template.

id: capabilities-researcher-pipeline
version: "9.0"
type: pipeline
energy_budget:
  gas_cap: 500000
  rjoule_cap: 5
description: >
  Full corpus pipeline for the Capabilities Researcher persona.
  Corpus steps run through the unified corpus MCP server with Jinja2 templates;
  training steps (assemble, submit) cross to the training MCP server.
  Separate embed, tag, and extract_triples steps (no combined classify).
  h_mem knowledge graph injected into build-prompts.
  Exact-match QA dedup. Typed EVA LoRA submission through the training MCP boundary.
  v9.0: 11 inter-phase gates verify artifact completeness on disk before
  proceeding — gates are BLOCKING with per-check remediation instructions.

env:
  HKASK_EMBEDDING_DIM: "1024"

  HKASK_DB_POOL_SIZE: "64"
  HKASK_HTTP_POOL_MAX_IDLE: "256"
  HKASK_CLASSIFIER_MODEL: "{{ classifier_model }}"
  HKASK_EMBEDDING_MODEL: "{{ embedding_model }}"

steps:
  # ═══════════════════════════════════════════════════════════════════════
  # Phase 0: Raw Files → Extracted Text
  # ═══════════════════════════════════════════════════════════════════════
  - id: extract_text
    description: "Extract text from 141 source files (83 PDF + 49 HTML + 9 other) from the Researcher library"
    tool: corpus_convert
    params:
      path: "corpus/source-library"
      output: "corpus/extracted/researcher"
    verify:
      - field: source_documents
        equals: 141
      - field: total_documents
        equals: 141
        # total_documents = newly extracted + safely resumed/skipped outputs.
      - field: failed
        equals: 0

  # ────────────────────────────────────────────────────────────────────────
  # GATE 1: extract_complete
  # Verifies that every source file was extracted to a non-empty .txt with
  # sane size relative to its source. This gate would have caught the v8.0
  # bug where the agent proceeded with only 85/141 files.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_extract_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Reconcile the supported source inventory with extracts on disk and reject
      empty, duplicate, orphaned, or implausibly small results. BLOCKING: do not
      proceed to chunk_all until every assertion passes.
    checks:
      - name: extract_inventory_and_quality
        artifact: "corpus/source-library/* -> corpus/extracted/researcher/*.txt"
        command: |
          python3 - <<'PY'
          from pathlib import Path
          source_dir = Path("corpus/source-library")
          output_dir = Path("corpus/extracted/researcher")
          supported = {".pdf", ".html", ".htm", ".md", ".txt", ".docx", ".pptx", ".xlsx", ".xls", ".csv"}
          sources = sorted(path for path in source_dir.iterdir() if path.is_file() and path.suffix.lower() in supported)
          expected = {f"{path.name}.txt": path for path in sources}
          extracts = {path.name: path for path in output_dir.glob("*.txt") if path.is_file()}
          missing = sorted(set(expected) - set(extracts))
          orphaned = sorted(set(extracts) - set(expected))
          too_small = sorted(name for name, path in extracts.items() if path.stat().st_size <= 100)
          suspicious = []
          for name, source in expected.items():
              extract = extracts.get(name)
              if extract is None:
                  continue
              source_size = source.stat().st_size
              extract_size = extract.stat().st_size
              if (source_size >= 1_048_576 and extract_size < 1_024) or (source_size >= 10_485_760 and extract_size < 4_096):
                  suspicious.append((source.name, source_size, extract_size))
          print({"sources": len(sources), "extracts": len(extracts), "missing": missing[:20],
                 "orphaned": orphaned[:20], "too_small": too_small[:20], "suspicious": suspicious[:20]})
          assert len(sources) == 141, f"expected 141 supported sources, found {len(sources)}"
          assert len(extracts) == 141, f"expected 141 extracts, found {len(extracts)}"
          assert not missing, f"missing extracts: {missing}"
          assert not orphaned, f"orphan extracts: {orphaned}"
          assert not too_small, f"extracts <=100 bytes: {too_small}"
          assert not suspicious, f"large-source/tiny-extract pairs: {suspicious}"
          print("GATE_PASS extract_inventory_and_quality")
          PY
        pass: "exit code 0; exact 141↔141 filename+.txt mapping; every extract >100 bytes; no suspicious size pairs"
        fail: "non-zero exit, missing/orphan file, <=100-byte extract, or large-source/tiny-extract pair"
        remediation: >
          Re-run corpus_convert only for the reported missing or suspicious sources.
          For timeout-prone runs, copy at most 20-30 reported sources into a temporary
          batch directory, run corpus_convert with the same output directory, and
          repeat until the missing set is empty. For a text-native PDF use
          `pdftotext SOURCE "corpus/extracted/researcher/$(basename SOURCE).txt"`;
          preserve the complete source filename because corpus_convert writes
          `<source filename>.txt` (for example `paper.pdf.txt`). If pdftotext is
          still near-empty, rerun corpus_convert on that file with force_ocr=true.
          Remove stale orphan outputs only after confirming they have no source.

      - name: extraction_response_reconciles
        artifact: "extract_text tool response"
        response_assertions:
          source_documents: { equals: 141 }
          total_documents: { equals: 141 }
          failed: { equals: 0 }
          failures: { length_equals: 0 }
        pass: "all response assertions hold and the disk inventory check also passes"
        fail: "the response reports a partial inventory or any failure, even if stale extracts make disk counts look complete"
        remediation: >
          Inspect every failures[] entry and rerun only those paths. If this was a
          resumed run, `extracted` may be zero and `skipped` may be 141; that is valid
          only when total_documents is 141, failed is zero, and the disk check passes.
    on_failure:
      action: halt
      resume: "repair extraction, then rerun every check in gate_extract_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1: Text → Chunks
  # ═══════════════════════════════════════════════════════════════════════
  - id: chunk_all
    description: "Chunk extracted text into ~512-token passages (tunable — validate QA coherence post-run; 256 over-fragmented, 512 is unvalidated)"
    tool: corpus_chunk
    params:
      input_dir: "corpus/extracted/researcher"
      output: "corpus/chunks/chunks.jsonl"
      # max_tokens is a tunable hypothesis. 256 over-fragmented passages (broke
      # sentence/paragraph integrity). 512 is the new default — UNVALIDATED.
      # After the re-run, inspect QA coherence and chunk boundary quality.
      # If 512 still fragments, bump to 768; if QAs are too generic, drop to 384.
      max_tokens: 512
      overlap_tokens: 64
      entity_ref_prefix: "corpus:researcher"
    verify:
      - field: total_documents
        equals: 141
      - field: total_chunks
        gte: 1
        # Exact chunk count is data-dependent; gate_chunk_complete reconciles
        # source coverage, unique refs, and overlap-aware text volume on disk.

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 1b: Purge existing data (pipeline recovery — clean slate)
  #
  # Deletes old embeddings and QA h_mems from the DB. Keeps chunks.jsonl intact.
  # This ensures a clean run even if a previous pipeline failed mid-way.
  # ═══════════════════════════════════════════════════════════════════════
  - id: purge_existing
    description: "Purge old embeddings and QA h_mems from DB for clean pipeline run"
    tool: corpus_purge_qa
    params:
      prefix: "corpus:researcher:"
      db_path: "corpus/memory/john-brooks.db"

  # ────────────────────────────────────────────────────────────────────────
  # GATE 2: chunk_complete
  # Verifies that chunking produced a valid JSONL with proportional volume.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_chunk_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Validate the complete chunks artifact, exact source coverage, identifier
      uniqueness, and text-volume conservation after chunk_all and purge_existing.
      BLOCKING: do not proceed to tag_chunks on partial or malformed output.
    checks:
      - name: chunk_integrity_coverage_and_volume
        artifact: "corpus/chunks/chunks.jsonl"
        command: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          extract_dir = Path("corpus/extracted/researcher")
          chunk_path = Path("corpus/chunks/chunks.jsonl")
          expected_sources = {path.name for path in extract_dir.glob("*.txt") if path.is_file()}
          extracted_words = sum(len(path.read_text(errors="replace").split()) for path in extract_dir.glob("*.txt"))
          records = []
          with chunk_path.open() as handle:
              for line_number, line in enumerate(handle, 1):
                  value = json.loads(line)
                  required = {"entity_ref", "source", "text", "word_count"}
                  assert required <= value.keys(), f"line {line_number}: missing {sorted(required - value.keys())}"
                  assert value["entity_ref"].startswith("corpus:researcher:"), f"line {line_number}: bad prefix"
                  assert value["text"].strip(), f"line {line_number}: empty text"
                  assert isinstance(value["word_count"], int) and value["word_count"] > 0, f"line {line_number}: invalid word_count"
                  records.append(value)
          refs = [record["entity_ref"] for record in records]
          duplicate_refs = [key for key, count in Counter(refs).items() if count != 1]
          actual_sources = {record["source"] for record in records}
          missing_sources = sorted(expected_sources - actual_sources)
          orphan_sources = sorted(actual_sources - expected_sources)
          chunk_words = sum(record["word_count"] for record in records)
          ratio = chunk_words / max(extracted_words, 1)
          print({"extract_sources": len(expected_sources), "chunk_sources": len(actual_sources),
                 "chunks": len(records), "duplicate_refs": duplicate_refs[:20],
                 "missing_sources": missing_sources[:20], "orphan_sources": orphan_sources[:20],
                 "extracted_words": extracted_words, "chunk_words": chunk_words, "word_ratio": round(ratio, 3)})
          assert expected_sources and len(expected_sources) == 141
          assert records, "no chunks"
          assert not duplicate_refs, f"duplicate entity_refs: {duplicate_refs[:20]}"
          assert not missing_sources, f"extracts with no chunks: {missing_sources[:20]}"
          assert not orphan_sources, f"unknown chunk sources: {orphan_sources[:20]}"
          assert 0.90 <= ratio <= 1.35, f"chunk/extract word ratio {ratio:.3f} outside overlap-aware range [0.90, 1.35]"
          print("GATE_PASS chunk_integrity_coverage_and_volume")
          PY
        pass: "exit code 0; valid JSONL; unique refs; exact 141-source coverage; overlap-aware word ratio 0.90..1.35"
        fail: "parse/schema error, duplicate ref, missing/orphan source, or implausible text-volume ratio"
        remediation: >
          Re-run chunk_all against the complete extraction directory. The chunker
          atomically replaces chunks.jsonl, so do not concatenate whole-run outputs.
          For a batch-only recovery, chunk subsets to separate temporary JSONL files,
          merge records by entity_ref, fail on duplicate keys, then sort by
          (source, entity_ref) into chunks.jsonl. A low word ratio means sources were
          skipped or text was dropped; a high ratio beyond overlap allowance usually
          means duplicate batches were appended. Repair Gate 1 first if source sets differ.

      - name: purge_response_is_clean
        artifact: "purge_existing tool response"
        response_assertions:
          embeddings_after: { equals: 0 }
          h_mem_errors: { equals: 0 }
        pass: "the purge reports zero remaining scoped embeddings and zero h_mem deletion errors"
        fail: "embeddings_after is non-zero, h_mem_errors is non-zero, or either field is absent"
        remediation: >
          Re-run purge_existing with prefix `corpus:researcher:` and the same DB.
          Do not continue with stale vectors: they make later count reconciliation
          and cosine clustering non-deterministic. Investigate DB/passphrase errors
          before rerunning this gate.
    on_failure:
      action: halt
      resume: "repair chunk or purge artifacts, then rerun every check in gate_chunk_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2a: Tag chunks → ontology tags JSONL (BEFORE embed)
  #
  # Tags first so embeddings can be ontology-anchored (per INSTRUCTOR,
  # Su et al. 2023). The LLM classifies each chunk against GOLEM, FIBO,
  # ESO, PKO, OMC, and Dublin Core ontologies. Tag data flows through
  # JSONL files to downstream tools (embed, extract_triples, build_prompts).
  #
  # Design decision: tag → embed (not embed → tag) because:
  #   1. Ontology tags as embedding "instructions" produce better KNN
  #      retrieval (instruction-tuned embeddings outperform raw, per MTEB)
  #   2. Tagging is a classification task — the passage text alone is
  #      sufficient for ontology classification (no KNN context needed)
  #   3. One-time classification cost, multiple downstream benefits
  #   4. Ontology-enhanced KG embeddings outperform baselines (Wang et al. 2023)
  # See: docs/architecture/adr-ontology-anchored-embedding.md
  # ═══════════════════════════════════════════════════════════════════════
  - id: tag_chunks
    description: >
      Tag chunks with 5W1H dimensions, Dublin Core, PKO, FIBO/GOLEM/ESO
      ontology tags, and expertise level. Uses tag-chunks.j2 template with
      the canonical classifier model (HKASK_CLASSIFIER_MODEL). Must run BEFORE embed so embeddings can be
      ontology-anchored. Output: tagged_ontology.jsonl.
    tool: corpus_tag_chunks
    params:
      chunks_jsonl: "corpus/chunks/chunks.jsonl"
      output: "corpus/chunks/tagged_ontology.jsonl"
      concurrency: 128
    verify:
      - field: total_chunks
        gte: 1
      - field: failed
        equals: 0
        # The tool writes fallback tags for failed calls. A complete line count is
        # therefore insufficient; failed must be zero to pass the quality boundary.

  # ────────────────────────────────────────────────────────────────────────
  # GATE 3: tag_complete
  # Verifies ontology tagging coverage and quality.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_tag_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Require a structurally valid ontology record for every chunk, with exact
      entity_ref equality and no fallback-producing LLM failures. BLOCKING: do
      not proceed to embed_chunks until the complete tag artifact passes.
    checks:
      - name: tag_keyset_and_quality
        artifact: "corpus/chunks/tagged_ontology.jsonl"
        command: |
          python3 - <<'PY'
          import json
          from collections import Counter
          def load(path):
              with open(path) as handle:
                  return [json.loads(line) for line in handle]
          chunks = load("corpus/chunks/chunks.jsonl")
          tagged = load("corpus/chunks/tagged_ontology.jsonl")
          chunk_refs = [item["entity_ref"] for item in chunks]
          tag_refs = [item["entity_ref"] for item in tagged]
          duplicates = [key for key, count in Counter(tag_refs).items() if count != 1]
          missing = sorted(set(chunk_refs) - set(tag_refs))
          orphaned = sorted(set(tag_refs) - set(chunk_refs))
          allowed_dimensions = {"who", "what", "when", "where", "why", "how"}
          invalid = []
          for index, item in enumerate(tagged, 1):
              dimensions = item.get("dimensions")
              if (not item.get("text", "").strip() or not isinstance(dimensions, list) or
                  not dimensions or not set(dimensions) <= allowed_dimensions or
                  not isinstance(item.get("ontology_tags"), dict) or
                  not isinstance(item.get("salience"), (int, float))):
                  invalid.append(index)
          print({"chunks": len(chunks), "tagged": len(tagged), "missing": missing[:20],
                 "orphaned": orphaned[:20], "duplicates": duplicates[:20], "invalid_lines": invalid[:20]})
          assert len(tagged) == len(chunks)
          assert not missing and not orphaned and not duplicates and not invalid
          print("GATE_PASS tag_keyset_and_quality")
          PY
        pass: "exit code 0; exact entity_ref set equality; no duplicates; every tag record satisfies ontology invariants"
        fail: "missing/orphan/duplicate refs, malformed JSON, empty text/dimensions, invalid dimensions, or missing ontology fields"
        remediation: >
          The tag tool rewrites the full output; rerun tag_chunks on chunks.jsonl.
          If rate limits caused failures, reduce concurrency from 128 to 32 or 16.
          For batch recovery, write each subset to its own tagged JSONL and merge by
          entity_ref; never concatenate without duplicate detection. Rerun this gate
          after the complete merge.

      - name: tag_response_has_no_fallbacks
        artifact: "tag_chunks tool response"
        response_assertions:
          failed: { equals: 0 }
          tagged: { equals_field: total_chunks }
        pass: "failed is zero and tagged equals total_chunks"
        fail: "any classifier call used fallback tags or the response is internally inconsistent"
        remediation: >
          Inspect provider errors, verify HKASK_CLASSIFIER_MODEL, lower concurrency,
          and rerun. A 1:1 output file does not waive this failure because the tool
          emits minimal fallback tags for failed calls.
    on_failure:
      action: halt
      resume: "repair tagging, then rerun every check in gate_tag_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2b: Embed chunks → ontology-anchored DB vectors (AFTER tag)
  #
  # Qwen3-Embedding-0.6B (1024-dim). Reads tagged_ontology.jsonl and prepends
  # ontology tag annotations to chunk text before embedding, producing
  # ontology-anchored vectors. Format: "[golem: metaphor | pko: analysis] <text>"
  # This is instruction-conditioned embedding per INSTRUCTOR (Su et al. 2023).
  # Stores vectors only — no h_mem storage.
  # ═══════════════════════════════════════════════════════════════════════
  - id: embed_chunks
    description: >
      Embed all chunks with Qwen3-Embedding-0.6B, using ontology tag
      annotations from tagged_ontology.jsonl as embedding instructions.
      Produces ontology-anchored vectors for improved KNN retrieval in
      dedup, consolidate, and build_prompts. 3-attempt retry per batch.
    tool: corpus_embed
    params:
      chunks_jsonl: "corpus/chunks/chunks.jsonl"
      tagged_jsonl: "corpus/chunks/tagged_ontology.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      batch_size: 50
    verify:
      - field: total
        gte: 1
      - field: failed
        equals: 0

  # ────────────────────────────────────────────────────────────────────────
  # GATE 4: embed_complete
  # Verifies embedding coverage matches chunk count.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_embed_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Reconcile chunk entity_refs against vectors actually persisted in the
      encrypted memory DB. BLOCKING: do not proceed to triple extraction with
      invisible chunks or stale extra vectors.
    checks:
      - name: embedding_db_keyset_matches_chunks
        artifact: "corpus/memory/john-brooks.db::embeddings"
        command: |
          command -v sqlcipher >/dev/null || { echo "sqlcipher CLI is required to inspect the encrypted DB"; exit 2; }
          PASSPHRASE="${HKASK_DB_PASSPHRASE:-hkask-default-passphrase-2024}"
          TMP_REFS=$(mktemp)
          trap 'rm -f "$TMP_REFS"' EXIT
          sqlcipher -batch corpus/memory/john-brooks.db \
            "PRAGMA key='$PASSPHRASE'; SELECT entity_ref FROM embeddings WHERE entity_ref LIKE 'corpus:researcher:%' ORDER BY entity_ref;" > "$TMP_REFS"
          python3 - "$TMP_REFS" <<'PY'
          import json, sys
          from collections import Counter
          with open("corpus/chunks/chunks.jsonl") as handle:
              expected = [json.loads(line)["entity_ref"] for line in handle]
          with open(sys.argv[1]) as handle:
              actual = [line.rstrip("\n") for line in handle if line.strip()]
          duplicate = [key for key, count in Counter(actual).items() if count != 1]
          missing = sorted(set(expected) - set(actual))
          stale = sorted(set(actual) - set(expected))
          print({"chunks": len(expected), "db_vectors": len(actual), "missing": missing[:20],
                 "stale": stale[:20], "duplicates": duplicate[:20]})
          assert len(actual) == len(expected)
          assert not missing and not stale and not duplicate
          print("GATE_PASS embedding_db_keyset_matches_chunks")
          PY
        pass: "exit code 0; DB vector entity_refs exactly equal chunk entity_refs"
        fail: "DB cannot be inspected, wrong passphrase, missing/stale/duplicate vector, or count mismatch"
        remediation: >
          Verify HKASK_DB_PASSPHRASE and install/use the sqlcipher CLI; inability to
          inspect is an indeterminate failure, not a pass. Re-run embed_chunks (stores
          are idempotent by entity_ref). If stale refs remain, rerun purge_existing,
          then embed the complete chunks.jsonl. Reduce batch_size to 25 for provider
          timeouts and rerun until the exact set matches.

      - name: embedding_response_reconciles
        artifact: "embed_chunks tool response"
        response_assertions:
          failed: { equals: 0 }
          embedded: { equals_field: total }
        pass: "failed is zero and embedded equals total; DB key-set check also passes"
        fail: "any batch/store failure or response mismatch"
        remediation: >
          Rerun failed batches, then rerun the full DB reconciliation. Never accept
          a percentage tolerance: one missing vector makes that chunk unreachable.
    on_failure:
      action: halt
      resume: "repair vectors, then rerun every check in gate_embed_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 2c: Extract triples → RDF triple h_mems in DB
  #
  # Canonical classifier model (HKASK_CLASSIFIER_MODEL, default deepseek-v4-flash). Uses extract-hmems.j2 template.
  # Extracts RDF triples (subject, predicate, object, confidence) per chunk.
  # Stores as h_mems with entity=chunk_ref (NOT triple.subject), owner=john-brooks.
  # 3-attempt retry with backoff. Thinking-mode JSON extraction.
  # predicate_to_dimension maps each predicate to a 5W1H dimension.
  # ═══════════════════════════════════════════════════════════════════════
  - id: extract_triples
    description: >
      Extract RDF triples from each chunk with the canonical classifier model
      (HKASK_CLASSIFIER_MODEL). Uses extract-hmems.j2
      template. Stores triples as h_mems with entity=chunk_ref, predicate as attribute,
      object as value, confidence and 5W1H dimension. 3-attempt retry.
    tool: corpus_extract_triples
    params:
      chunks_jsonl: "corpus/chunks/chunks.jsonl"
      tagged_jsonl: "corpus/chunks/tagged_ontology.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      owner: "john-brooks"
      max_triples: 15
      concurrency: 64
    verify:
      - field: succeeded
        gte: 1
      - field: failed
        equals: 0
      - field: h_mems_stored
        gte: 1

  # ────────────────────────────────────────────────────────────────────────
  # GATE 5: triples_complete
  # Verifies triple extraction produced a usable knowledge graph.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_triples_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Verify that every chunk completed triple extraction and that the DB contains
      a non-trivial, distributed knowledge graph rather than a tiny response-only
      count. BLOCKING: do not proceed to dedup_chunks on extraction failures.
    checks:
      - name: triple_db_distribution
        artifact: "corpus/memory/john-brooks.db::hmems"
        command: |
          command -v sqlcipher >/dev/null || { echo "sqlcipher CLI is required to inspect the encrypted DB"; exit 2; }
          PASSPHRASE="${HKASK_DB_PASSPHRASE:-hkask-default-passphrase-2024}"
          COUNTS=$(sqlcipher -batch corpus/memory/john-brooks.db \
            "PRAGMA key='$PASSPHRASE'; SELECT COUNT(*), COUNT(DISTINCT entity) FROM hmems WHERE entity LIKE 'corpus:researcher:%';")
          python3 - "$COUNTS" <<'PY'
          import json, sys
          total, entities = map(int, sys.argv[1].split("|"))
          with open("corpus/chunks/chunks.jsonl") as handle:
              chunks = sum(1 for _ in handle)
          coverage = entities / max(chunks, 1)
          print({"chunks": chunks, "stored_h_mems": total, "entities_with_triples": entities,
                 "entity_coverage": round(coverage, 3)})
          assert total >= chunks, f"expected at least one stored triple per chunk on average, found {total}/{chunks}"
          assert coverage >= 0.80, f"triple entity coverage {coverage:.3f} below 0.80"
          print("GATE_PASS triple_db_distribution")
          PY
        pass: "exit code 0; stored triples >= chunk count and distinct-entity coverage >=80%"
        fail: "DB unreadable, graph too small, or triples concentrated on fewer than 80% of chunks"
        remediation: >
          Check the model and DB write errors, reduce concurrency to 16 or 32, and
          rerun extract_triples. If reruns would duplicate h_mems, rerun
          purge_existing followed by embed_chunks and extract_triples. The 80%
          coverage criterion allows genuinely relation-free passages but blocks a
          graph concentrated in a small subset of the corpus.

      - name: triple_response_has_no_failed_chunks
        artifact: "extract_triples tool response"
        response_assertions:
          failed: { equals: 0 }
          succeeded: { equals_field: total_chunks }
          h_mems_stored: { gte: 1 }
        pass: "all chunks completed without transport, guard, parse, or store failure"
        fail: "failed is non-zero, succeeded differs from total_chunks, or no h_mems were stored"
        remediation: >
          Inspect the classified failure, lower concurrency, and rerun all failed
          chunks. Continue only after the response and DB distribution checks agree.
    on_failure:
      action: halt
      resume: "repair triple extraction, then rerun every check in gate_triples_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 3: Dedup (near-identical chunk removal, cosine > 0.85)
  # ═══════════════════════════════════════════════════════════════════════
  - id: dedup_chunks
    description: "Remove near-identical chunks using embeddings from DB"
    tool: corpus_dedup_chunks
    params:
      tagged_jsonl: "corpus/chunks/tagged_ontology.jsonl"
      output: "corpus/chunks/deduped.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      prefix: "corpus:researcher:"
      threshold: 0.85
    verify:
      - field: deduped
        gte: 1
      - field: removed
        gte: 0

  # ────────────────────────────────────────────────────────────────────────
  # GATE 6: dedup_complete
  # Verifies dedup produced a valid reduced dataset.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_dedup_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Validate deduped.jsonl as a unique, schema-valid subset of tagged chunks
      and reject implausible mass deletion. BLOCKING: do not consolidate until
      artifact and response counts reconcile exactly.
    checks:
      - name: dedup_subset_integrity
        artifact: "corpus/chunks/deduped.jsonl"
        command: |
          python3 - <<'PY'
          import json
          from collections import Counter
          def load(path):
              with open(path) as handle:
                  return [json.loads(line) for line in handle]
          original = load("corpus/chunks/tagged_ontology.jsonl")
          deduped = load("corpus/chunks/deduped.jsonl")
          original_refs = {item["entity_ref"] for item in original}
          refs = [item["entity_ref"] for item in deduped]
          duplicates = [key for key, count in Counter(refs).items() if count != 1]
          orphaned = sorted(set(refs) - original_refs)
          reduction = 1 - len(deduped) / max(len(original), 1)
          invalid = [index for index, item in enumerate(deduped, 1)
                     if not item.get("text", "").strip() or not item.get("source")]
          print({"original": len(original), "deduped": len(deduped),
                 "reduction": round(reduction, 4), "duplicates": duplicates[:20],
                 "orphaned": orphaned[:20], "invalid_lines": invalid[:20]})
          assert deduped and len(deduped) <= len(original)
          assert reduction <= 0.50, f"{reduction:.1%} reduction exceeds the 50% anomaly ceiling"
          assert not duplicates and not orphaned and not invalid
          print("GATE_PASS dedup_subset_integrity")
          PY
        pass: "exit code 0; valid unique subset; non-empty; reduction between 0% and 50%"
        fail: "malformed/duplicate/orphan records, expansion, empty output, or >50% removal"
        remediation: >
          Verify Gate 4 first. More than 50% removal at cosine 0.85 is treated as
          an embedding/threshold anomaly, not accepted automatically. Inspect vector
          diversity and duplicate clusters; if vectors are sound and the corpus is
          demonstrably repetitive, document evidence and deliberately revise this
          bound rather than bypassing the gate. Then rerun dedup_chunks.

      - name: dedup_response_reconciles
        artifact: "dedup_chunks tool response"
        response_assertions:
          original: { equals_line_count: "corpus/chunks/tagged_ontology.jsonl" }
          deduped: { equals_line_count: "corpus/chunks/deduped.jsonl" }
          arithmetic: "original = deduped + removed"
        pass: "all response counts equal the disk artifacts and arithmetic balances"
        fail: "summary and disk counts differ or original != deduped + removed"
        remediation: >
          Delete the partial output and rerun dedup_chunks. Do not merge dedup
          batches independently because cross-batch near-duplicates would escape.
    on_failure:
      action: halt
      resume: "repair deduplication, then rerun every check in gate_dedup_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 4: Consolidate (LLM synthesis of related chunks, cosine > 0.75)
  #
  # Uses consolidate-chunks.j2 template. Clusters within source, LLM-synthesizes
  # multi-chunk clusters, re-embeds consolidated text.
  # ═══════════════════════════════════════════════════════════════════════
  - id: consolidate_chunks
    description: "Cluster related chunks, LLM-synthesize multi-chunk clusters"
    tool: corpus_consolidate_chunks
    params:
      tagged_jsonl: "corpus/chunks/deduped.jsonl"
      output: "corpus/chunks/consolidated.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      prefix: "corpus:researcher:"
      threshold: 0.75
      concurrency: 12
      max_chunks_per_cluster: 5
    verify:
      - field: consolidated
        gte: 1
      - field: reembedded
        gte: 0

  # ────────────────────────────────────────────────────────────────────────
  # GATE 7: consolidate_complete
  # Verifies consolidation produced a valid output with re-embedded vectors.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_consolidate_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Validate consolidated output, unique identifiers, and lossless lineage
      coverage of every deduped chunk. BLOCKING: do not build prompts if any
      source chunk disappears or synthesized passages lack fresh embeddings.
    checks:
      - name: consolidation_lineage_integrity
        artifact: "corpus/chunks/consolidated.jsonl"
        command: |
          python3 - <<'PY'
          import json
          from collections import Counter
          def load(path):
              with open(path) as handle:
                  return [json.loads(line) for line in handle]
          inputs = load("corpus/chunks/deduped.jsonl")
          outputs = load("corpus/chunks/consolidated.jsonl")
          input_refs = {item["entity_ref"] for item in inputs}
          output_refs = [item["entity_ref"] for item in outputs]
          covered = set()
          invalid = []
          for index, item in enumerate(outputs, 1):
              if not item.get("text", "").strip() or not item.get("source"):
                  invalid.append(index)
              lineage = item.get("consolidated_from") or [item["entity_ref"]]
              covered.update(lineage)
          duplicates = [key for key, count in Counter(output_refs).items() if count != 1]
          missing = sorted(input_refs - covered)
          orphaned = sorted(covered - input_refs)
          print({"deduped": len(inputs), "consolidated": len(outputs), "covered_inputs": len(covered),
                 "missing_lineage": missing[:20], "orphan_lineage": orphaned[:20],
                 "duplicate_output_refs": duplicates[:20], "invalid_lines": invalid[:20]})
          assert outputs and len(outputs) <= len(inputs)
          assert not missing and not orphaned and not duplicates and not invalid
          print("GATE_PASS consolidation_lineage_integrity")
          PY
        pass: "exit code 0; valid unique output; every deduped ref appears exactly as singleton or in consolidated_from lineage"
        fail: "malformed/duplicate output, expansion, or missing/orphan lineage"
        remediation: >
          Rerun consolidate_chunks from the complete deduped.jsonl. Do not batch
          consolidation across arbitrary splits because clustering is source-local;
          if batching is necessary, partition by complete source and merge by
          entity_ref with lineage reconciliation.

      - name: consolidation_response_reconciles
        artifact: "consolidate_chunks tool response"
        response_assertions:
          original: { equals_line_count: "corpus/chunks/deduped.jsonl" }
          consolidated: { equals_line_count: "corpus/chunks/consolidated.jsonl" }
          reembedded: { equals_field: multi_chunk_clusters }
          arithmetic: "original = consolidated + absorbed"
        pass: "disk counts balance and every synthesized multi-chunk cluster was re-embedded"
        fail: "count arithmetic differs or reembedded != multi_chunk_clusters"
        remediation: >
          Re-run consolidation after fixing model or embedding failures. Fresh
          embeddings are mandatory because build_prompts performs KNN retrieval;
          the prior draft's claim that missing re-embeddings were non-fatal was unsafe.
    on_failure:
      action: halt
      resume: "repair consolidation, then rerun every check in gate_consolidate_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 5: Build Bloom QA Prompts (5 per chunk, KNN + h_mem knowledge graph)
  #
  # Uses build-prompts.j2 template. For each chunk:
  #   1. KNN scaffold from DB embeddings (source-scoped)
  #   2. Ontology context (5W1H, Dublin Core, PKO, tags)
  #   3. Concept graph (concept → chunk_count centrality)
  #   4. h_mem knowledge graph via semantic.query_deduped(chunk_ref)
  # 5 prompts per chunk: factual, conceptual, analyze, evaluate, create.
  # ═══════════════════════════════════════════════════════════════════════
  - id: build_prompts
    description: >
      Build Bloom taxonomy prompts: 5 QAs per chunk. KNN scaffold from DB
      embeddings. Ontology context + concept graph + h_mem knowledge graph.
      Uses build-prompts.j2 template.
    tool: corpus_build_prompts
    params:
      tagged_jsonl: "corpus/chunks/consolidated.jsonl"
      output: "corpus/qa_pairs/prompts.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      context_k: 3
      prompts_per_chunk: 5
      type_distribution: "1,1,1,1,1"
      # Per-ontology Bloom distribution overrides:
      #   golem (narrative): more analyze/create — interpret character, identify themes
      #   fibo (financial): more factual/conceptual — define ROIC, explain DCF
      #   pko (process): more evaluate — assess procedure effectiveness
      #   eso (epistemic): more analyze/evaluate — assess evidence, evaluate claims
      ontology_bloom_overrides: "golem:0,1,2,1,1|fibo:2,1,1,1,0|pko:1,1,1,1,1|eso:1,1,2,1,0|epistemic:1,1,2,1,0"
      owner: "john-brooks"
    verify:
      - field: prompts_written
        gte: 5

  # ────────────────────────────────────────────────────────────────────────
  # GATE 8: prompts_complete
  # Verifies prompt building produced a valid prompts.jsonl with expected volume.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_prompts_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Require exactly five valid Bloom prompts per consolidated chunk, matching
      the configured per-ontology distribution (including intentional repeated
      types). BLOCKING: do not generate QAs from partial scaffolds.
    checks:
      - name: prompt_matrix_complete
        artifact: "corpus/qa_pairs/prompts.jsonl"
        command: |
          python3 - <<'PY'
          import json
          from collections import Counter, defaultdict
          allowed = {"factual", "conceptual", "analyze", "evaluate", "create"}
          default = ["factual", "conceptual", "analyze", "evaluate", "create"]
          overrides = {
              "golem": ["conceptual", "analyze", "analyze", "evaluate", "create"],
              "fibo": ["factual", "factual", "conceptual", "analyze", "evaluate"],
              "pko": default,
              "eso": ["factual", "conceptual", "analyze", "analyze", "evaluate"],
              "epistemic": ["factual", "conceptual", "analyze", "analyze", "evaluate"],
          }
          priority = ["pko", "golem", "fibo", "eso", "epistemic"]
          with open("corpus/chunks/consolidated.jsonl") as handle:
              chunks = {item["entity_ref"]: item for item in map(json.loads, handle)}
          prompts = []
          with open("corpus/qa_pairs/prompts.jsonl") as handle:
              for line_number, line in enumerate(handle, 1):
                  item = json.loads(line)
                  required = {"chunk_ref", "source", "qa_type", "system", "user"}
                  assert required <= item.keys(), f"line {line_number}: missing fields"
                  assert item["qa_type"] in allowed, f"line {line_number}: invalid qa_type"
                  assert item["system"].strip() and item["user"].strip(), f"line {line_number}: empty prompt"
                  prompts.append(item)
          matrix = defaultdict(list)
          for item in prompts:
              matrix[item["chunk_ref"]].append(item["qa_type"])
          bad = {}
          for ref, chunk in chunks.items():
              namespaces = chunk.get("ontology_tags", {})
              selected = next((namespace for namespace in priority if namespace in namespaces), None)
              expected = overrides[selected] if selected else default
              if Counter(matrix.get(ref, [])) != Counter(expected):
                  bad[ref] = {"actual": matrix.get(ref, []), "expected": expected, "selected": selected}
          missing = sorted(set(chunks) - set(matrix))
          orphaned = sorted(set(matrix) - set(chunks))
          print({"chunks": len(chunks), "prompts": len(prompts), "missing_chunks": missing[:20],
                 "orphan_chunks": orphaned[:20], "distribution_mismatches": list(bad.items())[:20]})
          assert len(prompts) == len(chunks) * 5
          assert not missing and not orphaned and not bad
          print("GATE_PASS prompt_matrix_complete")
          PY
        pass: "exit code 0; exactly five valid prompts per chunk with the configured ontology-specific type multiset"
        fail: "malformed prompt, missing/orphan chunk, invalid type, wrong count, or distribution mismatch"
        remediation: >
          Re-run build_prompts from the complete consolidated artifact. If batching,
          partition by entity_ref and merge only disjoint chunk_ref groups. Repeated
          qa_type values within a chunk are intentional when an ontology override
          weights that Bloom level; validate the complete five-item multiset.

      - name: prompt_response_reconciles
        artifact: "build_prompts tool response"
        response_assertions:
          total_chunks: { equals_line_count: "corpus/chunks/consolidated.jsonl" }
          prompts_written: { equals_line_count: "corpus/qa_pairs/prompts.jsonl" }
        pass: "response counts exactly match both artifacts"
        fail: "tool summary and artifact counts differ"
        remediation: "Delete partial prompts.jsonl, rerun build_prompts, and rerun this gate."
    on_failure:
      action: halt
      resume: "repair prompt construction, then rerun every check in gate_prompts_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 6: Generate QAs (GLM-5.2, per-Bloom sampling, thinking-mode)
  #
  # GLM-5.2 (HKASK_DEFAULT_MODEL — hkask default). Uses generate-qa.j2 template. Thinking-mode JSON
  # extraction via extract_json_from_response. ContentGuard on input + output.
  # Provenance attached (chunk_ref, source, concepts, evidence_quotes).
  # ═══════════════════════════════════════════════════════════════════════
  - id: generate_qas
    description: >
      Generate QA pairs via GLM-5.2 (hkask default, OpenRouter). Per-Bloom sampling parameters.
      Thinking-mode JSON extraction. ContentGuard. Provenance-enriched output.
    tool: corpus_generate_qa_batch
    params:
      prompts_jsonl: "corpus/qa_pairs/prompts.jsonl"
      output: "corpus/qa_pairs/generated.jsonl"
      concurrency: 196
      model: "{{ qa_model }}"
    verify:
      - field: written
        gte: 1
      - field: failed
        equals: 0

  # ────────────────────────────────────────────────────────────────────────
  # GATE 9: qa_generation_complete
  # Verifies QA generation produced usable output with acceptable failure rate.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_qa_generation_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Require valid QA records with no error lines and complete coverage of the
      prompt matrix. BLOCKING: do not ingest a partial generation run.
    checks:
      - name: generated_qa_integrity_and_coverage
        artifact: "corpus/qa_pairs/generated.jsonl"
        command: |
          python3 - <<'PY'
          import json
          from collections import Counter
          with open("corpus/qa_pairs/prompts.jsonl") as handle:
              prompt_keys = {(item["chunk_ref"], item["qa_type"]) for item in map(json.loads, handle)}
          records = []
          with open("corpus/qa_pairs/generated.jsonl") as handle:
              for line_number, line in enumerate(handle, 1):
                  item = json.loads(line)
                  assert "error" not in item, f"line {line_number}: error record: {item['error']}"
                  response = item.get("response", {})
                  assert response.get("instruction", "").strip(), f"line {line_number}: empty instruction"
                  assert response.get("output", "").strip(), f"line {line_number}: empty output"
                  assert item.get("chunk_ref") and item.get("qa_type"), f"line {line_number}: missing provenance key"
                  records.append(item)
          generated_keys = {(item["chunk_ref"], item["qa_type"]) for item in records}
          missing = sorted(prompt_keys - generated_keys)
          orphaned = sorted(generated_keys - prompt_keys)
          duplicate_questions = [key for key, count in Counter(
              item["response"]["instruction"].strip().casefold() for item in records).items() if count != 1]
          print({"prompt_keys": len(prompt_keys), "qa_records": len(records),
                 "covered_keys": len(generated_keys), "missing_keys": missing[:20],
                 "orphan_keys": orphaned[:20], "duplicate_questions": duplicate_questions[:20]})
          assert records and not missing and not orphaned
          assert not duplicate_questions, "duplicate questions indicate appended/repeated batches"
          print("GATE_PASS generated_qa_integrity_and_coverage")
          PY
        pass: "exit code 0; every prompt key has >=1 valid QA; no error records, orphan keys, or duplicate questions"
        fail: "parse/schema error, error record, uncovered prompt, orphan QA, or duplicate instruction"
        remediation: >
          Reduce concurrency from 196 to 64 or 32 and rerun failed prompts.
          Because the tool creates/truncates its output for a full run, prefer a
          clean full rerun. For manual batch recovery, merge only successful
          records, deduplicate by normalized instruction, and reconcile every
          (chunk_ref, qa_type) key before rerunning this gate.

      - name: qa_generation_response_reconciles
        artifact: "generate_qas tool response"
        response_assertions:
          total: { equals_line_count: "corpus/qa_pairs/prompts.jsonl" }
          written: { equals_line_count: "corpus/qa_pairs/generated.jsonl" }
          failed: { equals: 0 }
        pass: "input/output counts match disk and no prompt failed"
        fail: "summary differs from artifacts or failed is non-zero"
        remediation: >
          Inspect provider, ContentGuard, and JSON-extraction errors; rerun all
          failed prompt keys and repeat the artifact reconciliation.
    on_failure:
      action: halt
      resume: "repair QA generation, then rerun every check in gate_qa_generation_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 7: Ingest QAs (exact-match dedup + h_mem storage)
  #
  # corpus_ingest_qa parses generated QAs, quality-filters, applies exact-match
  # dedup (case-insensitive on instruction), writes training JSONL, and stores QA
  # h_mems with 5W1H dimension (What) + Dublin Core / PKO metadata. Semantic
  # dedup (SemDeDup K-means) was removed from the tool — see its inline rationale.
  # QA vectors are not embedded by this step.
  # ═══════════════════════════════════════════════════════════════════════
  - id: ingest_qas
    description: >
      Parse generated QAs, quality-filter, exact-match dedup (case-insensitive
      on instruction). Store QA h_mems with 5W1H + Dublin Core + PKO provenance.
      Write training-ready JSONL.
    tool: corpus_ingest_qa
    params:
      generated_jsonl: "corpus/qa_pairs/generated.jsonl"
      output: "corpus/qa_pairs/train.jsonl"
      db_path: "corpus/memory/john-brooks.db"
      dataset: "capabilities-researcher"
      owner: "john-brooks"
    verify:
      - field: deduped
        gte: 1
      - field: stored_h_mems
        gte: 1

  # ────────────────────────────────────────────────────────────────────────
  # GATE 10: qa_ingest_complete
  # Verifies QA ingestion produced a valid training JSONL and stored h_mems.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_qa_ingest_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Validate the training-ready JSONL, exact-match dedup invariant, quality
      minima, and persisted QA-memory count. BLOCKING: do not assemble ChatML
      until disk and DB agree.
    checks:
      - name: training_jsonl_quality_and_uniqueness
        artifact: "corpus/qa_pairs/train.jsonl"
        command: |
          python3 - <<'PY'
          import json
          from collections import Counter
          records = []
          with open("corpus/qa_pairs/train.jsonl") as handle:
              for line_number, line in enumerate(handle, 1):
                  item = json.loads(line)
                  assert {"instruction", "input", "output"} <= item.keys(), f"line {line_number}: missing field"
                  assert len(item["instruction"].strip()) >= 30, f"line {line_number}: short instruction"
                  assert len(item["output"].strip()) >= 50, f"line {line_number}: short output"
                  records.append(item)
          duplicates = [key for key, count in Counter(
              item["instruction"].strip().casefold() for item in records).items() if count != 1]
          print({"training_records": len(records), "duplicate_instructions": duplicates[:20]})
          assert records and not duplicates
          print("GATE_PASS training_jsonl_quality_and_uniqueness")
          PY
        pass: "exit code 0; every record has required fields and quality lengths; normalized instructions are unique"
        fail: "malformed/short record, duplicate normalized instruction, or empty dataset"
        remediation: >
          Re-run ingest_qas from the validated generated artifact. If records are
          short, repair QA generation rather than weakening the quality filter.
          If duplicates appear, delete stale train.jsonl and rerun; do not append
          ingestion outputs.

      - name: ingest_response_and_db_reconcile
        artifact: "ingest_qas response plus corpus/memory/john-brooks.db"
        command: |
          command -v sqlcipher >/dev/null || { echo "sqlcipher CLI is required to inspect the encrypted DB"; exit 2; }
          PASSPHRASE="${HKASK_DB_PASSPHRASE:-hkask-default-passphrase-2024}"
          TRAIN_COUNT=$(wc -l < corpus/qa_pairs/train.jsonl)
          DB_COUNT=$(sqlcipher -batch corpus/memory/john-brooks.db \
            "PRAGMA key='$PASSPHRASE'; SELECT COUNT(*) FROM hmems WHERE attribute = 'training_qa_pair' AND value LIKE '%\"dataset\":\"capabilities-researcher\"%';")
          echo "train_jsonl=$TRAIN_COUNT db_training_qa_pairs=$DB_COUNT"
          test "$DB_COUNT" -eq "$TRAIN_COUNT"
          echo "GATE_PASS ingest_response_and_db_reconcile"
        response_assertions:
          deduped: { equals_line_count: "corpus/qa_pairs/train.jsonl" }
          stored_h_mems: { equals_line_count: "corpus/qa_pairs/train.jsonl" }
        pass: "DB and response counts exactly equal train.jsonl line count"
        fail: "DB unreadable or any count differs"
        remediation: >
          Verify passphrase and dataset name, purge stale QA h_mems, and rerun
          ingest_qas. Count drift usually means a partial prior run or DB write errors.
    on_failure:
      action: halt
      resume: "repair ingestion, then rerun every check in gate_qa_ingest_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 8: Assemble ChatML dataset (Rust MCP tool — no Python)
  #
  # training_assemble_dataset queries training_qa_pair h_mems from the DB
  # (stored by corpus_ingest_qa in Phase 7), converts to ChatML format with
  # the Capabilities Researcher system prompt, and writes train/val/test split.
  # ═══════════════════════════════════════════════════════════════════════
  - id: assemble_chatml
    description: >
      Assemble stored QA h_mems into ChatML JSONL training dataset with
      80/20 train/test split. Queries semantic memory for
      training_qa_pair h_mems from the capabilities-researcher dataset.
    tool: training_assemble_dataset
    params:
      dataset: "capabilities-researcher"
      output_path: "corpus/qa_pairs/train_chat.jsonl"
      train_split: 0.80
      system_prompt: >
        You are a Capabilities Researcher. You analyze the gap between what
        organizations, markets, and systems are capable of and what they
        actually achieve. Your analysis draws on economic theory, systems
        thinking, computing principles, and institutional analysis.
    verify:
      - field: train_examples
        gte: 100
      - field: test_examples
        gte: 1

  # ────────────────────────────────────────────────────────────────────────
  # GATE 11: chatml_complete
  # Final gate before training submission. Verifies the ChatML dataset is
  # valid and large enough for LoRA training.
  # ────────────────────────────────────────────────────────────────────────
  - id: gate_chatml_complete
    type: gate
    blocking: true
    pass_policy: all
    description: >
      Final pre-spend gate: reconcile train/test split counts, enforce exact
      ChatML role order and non-empty content, reject duplicates and examples
      likely to exceed sequence_len. BLOCKING: do not submit training on failure.
    checks:
      - name: chatml_train_test_quality
        artifact: "corpus/qa_pairs/train_chat.jsonl and .test.jsonl"
        command: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          paths = [Path("corpus/qa_pairs/train_chat.jsonl"), Path("corpus/qa_pairs/train_chat.jsonl.test.jsonl")]
          datasets = []
          for path in paths:
              records = []
              with path.open() as handle:
                  for line_number, line in enumerate(handle, 1):
                      item = json.loads(line)
                      messages = item.get("messages")
                      assert isinstance(messages, list) and [m.get("role") for m in messages] == ["system", "user", "assistant"], f"{path}:{line_number}: bad roles"
                      assert all(isinstance(m.get("content"), str) and m["content"].strip() for m in messages), f"{path}:{line_number}: empty content"
                      total_chars = sum(len(m["content"]) for m in messages)
                      assert total_chars <= 16_000, f"{path}:{line_number}: {total_chars} chars risks 4096-token truncation"
                      records.append(item)
              datasets.append(records)
          train, test = datasets
          train_users = [item["messages"][1]["content"].strip().casefold() for item in train]
          test_users = [item["messages"][1]["content"].strip().casefold() for item in test]
          duplicate_train = [key for key, count in Counter(train_users).items() if count != 1]
          overlap = sorted(set(train_users) & set(test_users))
          total = len(train) + len(test)
          ratio = len(train) / max(total, 1)
          print({"train": len(train), "test": len(test), "train_ratio": round(ratio, 4),
                 "duplicate_train_users": duplicate_train[:20], "train_test_overlap": overlap[:20]})
          assert len(train) >= 100 and test
          assert abs(ratio - 0.80) <= (1 / max(total, 1)), f"split ratio {ratio:.4f} differs from 0.80 beyond rounding"
          assert not duplicate_train and not overlap
          print("GATE_PASS chatml_train_test_quality")
          PY
        pass: "exit code 0; exact role order/content; >=100 train; non-empty test; 80/20 within one-record rounding; no duplicates/overlap; <=16K chars"
        fail: "missing/malformed split, bad roles/content, wrong ratio, duplicate/leakage, or oversized example"
        remediation: >
          Re-run assemble_chatml from the validated QA h_mems. If examples exceed
          16K characters, shorten source QAs or deliberately raise sequence_len
          after memory-cost review; do not silently accept truncation. Duplicate or
          train/test-overlap failures require deduplication before splitting.

      - name: chatml_response_reconciles
        artifact: "assemble_chatml tool response"
        response_assertions:
          train_examples: { equals_line_count: "corpus/qa_pairs/train_chat.jsonl" }
          test_examples: { equals_line_count: "corpus/qa_pairs/train_chat.jsonl.test.jsonl" }
          arithmetic: "total_matched = train_examples + test_examples"
          train_path: { equals: "corpus/qa_pairs/train_chat.jsonl" }
        pass: "response paths/counts exactly match disk and split arithmetic balances"
        fail: "missing field, path mismatch, count drift, or unbalanced split"
        remediation: >
          Verify dataset name and DB QA count, remove stale split files, rerun
          assemble_chatml, then repeat both gate checks before authorizing spend.
    on_failure:
      action: halt
      resume: "repair ChatML assembly, then rerun every check in gate_chatml_complete"

  # ═══════════════════════════════════════════════════════════════════════
  # Phase 9: LoRA Training (RunPod H100 via training_submit MCP tool)
  #
  # training_submit accepts the typed TrainingParams contract. Do not pass a
  # raw config path or host selector: those bypass the canonical harness seam
  # and are not part of TrainSubmitRequest.
  #
  # The accepted operator configuration uses EVA initialization. The registered
  # lora-training skill recommends and audits the config; runtime validation
  # enforces established hard contracts without rewriting operator intent.
  #
  # skill_name is retrain-mode-only: it is silently ignored unless feedback_path
  # is set. For this first-time training run (no feedback_path) the adapter is
  # not registered under the skill name; re-run with feedback_path for A/B tracking.
  # ═══════════════════════════════════════════════════════════════════════
  - id: train_lora
    description: "Submit typed EVA LoRA training job to RunPod H100"
    tool: training_submit
    params:
      dataset_path: "corpus/qa_pairs/train_chat.jsonl"
      base_model: "unsloth/Qwen3.6-27B"
      skill_name: "capabilities-researcher"
      params:
        num_epochs: 3
        batch_size: 1
        learning_rate: 0.0001
        lora:
          r: 32
          alpha: 64
          dropout: 0
          target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
          init_lora_weights: eva
        optimization:
          optimizer: adamw_8bit
          weight_decay: 0.01
          warmup_steps: 100
          lr_scheduler: cosine
          gradient_accumulation_steps: 16
          max_grad_norm: 0.3
        sequence:
          sequence_len: 4096
        advanced:
          attn_implementation: sdpa
          gradient_checkpointing: "true"
          bf16: true
          eval_split_ratio: 0.0012
    requires_consent: true