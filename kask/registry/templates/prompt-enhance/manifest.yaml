# Template crate manifest for prompt-enhance skill
# hKask v0.34.0 — Streamlined

crate:
  name: prompt-enhance
  version: "0.34.0"
  description: >
    General-purpose prompt enhancement skill for prompts destined for the
    zed-kask platform (skill .j2 templates, agent system prompts, chat/REPL
    prompts, infrastructure Jinja2 templates). Typed routing over a 7-type
    prompt taxonomy (coding, reasoning, creative, classification, extraction,
    agent-task, meta) with a 3-tier effort knob (low/medium/high). Single-pass
    pipeline: classify, rewrite (with inline audit), verify (decoupled critic
    at medium/high), output. Default output is the enhanced prompt returned
    inline in a copyable code block; optional output_format supports file save
    or both.

templates:
  - id: prompt-enhance/enhance-classify
    name: "Classify prompt type, select effort tier, resolve output format"
    path: enhance-classify.j2
    type: KnowAct
    description: >
      Classify the input prompt against the 7-type taxonomy (coding, reasoning,
      creative, classification, extraction, agent-task, meta) using pragmatic-
      semantics IS/OUGHT + epistemic-mode axes. Select the effort tier
      (low/medium/high) and validate the output_format (inline/file/both,
      default inline). Synthesize a minimal proxy eval set (3-5 representative
      inputs) for medium/high tiers. Produces the routing decision consumed by
      the rewrite step.
    generates_spans:
      - reg.prompt-enhance.classify

  - id: prompt-enhance/enhance-rewrite
    name: "Inline audit + typed rewrite"
    path: enhance-rewrite.j2
    type: KnowAct
    description: >
      Unified audit + typed rewrite in a single LLM call. Scans for unresolved
      placeholders (Prohibition), semantic fragility (Guardrail), and structural
      accretion (essentialist G1+G2), then applies type-specific rewrite moves
      based on prompt_type. Folds the former 3-step pipeline (audit → 7-way
      branch → collector) into one call. Produces the enhanced prompt, mutations
      applied/deferred, acceptance criteria, and audit findings.
    generates_spans:
      - reg.prompt-enhance.rewrite

  - id: prompt-enhance/enhance-verify
    name: "Decoupled critic via grill-me self-challenge"
    path: enhance-verify.j2
    type: KnowAct
    description: >
      Decoupled critic. Runs grill-me self-challenge against the enhanced
      prompt across Recall → Mechanism → Rationale → Edge Cases → Synthesis.
      Decoupled from the rewrite to prevent the self-confirming loop
      (self-improvement §9.1 critic-decoupling requirement). Tier-scaled:
      1 round (Recall+Mechanism) at medium, 3 escalating rounds at high.
      Produces a Solid/Partial/Gap rating per area and a verdict
      (pass/rewrite_needed/fail). Skipped at low tier. No PDCA re-entry —
      the verdict is surfaced in the output change log.
    generates_spans:
      - reg.prompt-enhance.verify

  - id: prompt-enhance/enhance-output
    name: "Format and deliver the enhanced prompt"
    path: enhance-output.j2
    type: KnowAct
    description: >
      Format the final enhanced prompt per output_format contract. inline
      (default): return the prompt in a fenced code block with a one-line
      summary and the change log. file: write the prompt to a path the user
      specifies (or a derived default under tasks/). both: inline + file.
      Always include a change-log section: type, effort, grill verdict, audit
      findings by constraint force, mutations applied, deferred findings, and
      residual risks.
    generates_spans:
      - reg.prompt-enhance.output
